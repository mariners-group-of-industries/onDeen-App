project.ext.react = [
    enableHermes: false,  // Disable Hermes temporarily
    entryFile: file("../../index.js"),
]

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
apply plugin: 'com.google.gms.google-services' // <- Add this line

react {
    autolinkLibrariesWithApp()
}


def enableProguardInReleaseBuilds = true


def jscFlavor = 'org.webkit:android-jsc:+'

def ondeenDebugArchitectures() {
    def value = project.findProperty("ondeenDebugArchitectures")
    return value ? value.toString().split(",") : null
}

def isDebugTaskRequested() {
    return gradle.startParameter.taskNames.any { it.toLowerCase().contains("debug") }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ondeenorganiser"
    defaultConfig {
        missingDimensionStrategy 'react-native-camera', 'general' 
        applicationId "com.ondeenorganiser"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        def debugArchitectures = ondeenDebugArchitectures()
        if (debugArchitectures && isDebugTaskRequested()) {
            ndk {
                abiFilters (*debugArchitectures)
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            shrinkResources true
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    // build.sh generates a standalone debug JS bundle under build/generated.
    // Keep release signing unchanged until the real production keystore/CI setup is confirmed.
    sourceSets {
        debug {
            assets.srcDirs += file("$buildDir/generated/assets/react/debug")
            res.srcDirs += file("$buildDir/generated/res/react/debug")
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation project(':react-native-fs')

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

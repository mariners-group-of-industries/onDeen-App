<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>OnDeen - Session Summary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">

                extend: {

                        "secondary-fixed-dim": "#ffb0cd",
                        "on-error": "#ffffff",
                        "bg-app": "#F5F3F9",
                        "primary-fixed": "#eaddff",
                        "tertiary-container": "#762300",
                        "axis-fitness": "#2ECC71",
                        "surface-card": "#FFFFFF",
                        "status-free": "#2ECC71",
                        "on-tertiary-container": "#ff8c63",
                        "on-background": "#1d1a21",
                        "surface-dim": "#ded8e1",
                        "outline": "#7a7583",
                        "text-primary": "#1A1A1A",
                        "text-muted": "#7A7A7A",
                        "on-primary-container": "#ba9aff",
                        "primary-container": "#4b2a8c",
                        "on-secondary-container": "#fffbff",
                        "on-primary-fixed": "#24005b",
                        "surface-bright": "#fef7ff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "surface": "#fef7ff",
                        "inverse-primary": "#d2bcff",
                        "gradient-sunset-end": "#E8418F",
                        "on-surface-variant": "#494551",
                        "outline-variant": "#cbc3d3",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#523294",
                        "on-tertiary-fixed": "#390c00",
                        "on-secondary-fixed-variant": "#8c0053",
                        "axis-ummah": "#E6288E",
                        "inverse-on-surface": "#f5eef8",
                        "xp-track": "#EFEBF5",
                        "surface-variant": "#e7e0e9",

                        "axis-tazkiyyah": "#4B2A8C",
                        "gradient-sunset-mid": "#FF7A4A",
                        "error": "#ba1a1a",
                        "axis-knowledge": "#FFC94B",
                        "primary-fixed-dim": "#d2bcff",
                        "primary": "#340b75",
                        "on-surface": "#1d1a21",
                        "tertiary": "#511500",
                        "secondary-fixed": "#ffd9e4",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#322f36",
                        "error-container": "#ffdad6",

                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        full: "9999px"
                    },
                    spacing: {
                        "screen-edge": "20px",

<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: theme('colors.bg-app');
            color: theme('colors.text-primary');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .bg-gradient-sunset {
            background: linear-gradient(135deg, theme('colors.gradient-sunset-start'), theme('colors.gradient-sunset-mid'), theme('colors.gradient-sunset-end'));
        }

        .text-gradient-sunset {
            background: linear-gradient(135deg, theme('colors.gradient-sunset-start'), theme('colors.gradient-sunset-end'));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Circular Progress */
        .circular-chart {
            display: block;
            margin: 0 auto;
            max-width: 80%;
            max-height: 250px;
        }
        .circle-bg {
            fill: none;
            stroke: theme('colors.xp-track');
            stroke-width: 3.8;
        }
        .circle {
            fill: none;
            stroke-width: 2.8;
            stroke-linecap: round;
            /* 3440 / 3450 = ~99.7% */
            stroke-dasharray: 99.7, 100;
            transition: stroke-dasharray 1s ease-out;
        }
        
        /* Custom Gradient for SVG Stroke */
        .svg-defs {
            width: 0;
            height: 0;
            position: absolute;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-start pb-24">
<!-- SVG Definitions for Gradients -->
<svg class="svg-defs">
<defs>
<linearGradient id="sunsetGradient" x1="0%" x2="100%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FFC94B"></stop>
<stop offset="50%" stop-color="#FF7A4A"></stop>
<stop offset="100%" stop-color="#E8418F"></stop>
</linearGradient>
</defs>
</svg>
<!-- Top App Bar -->
<header class="w-full top-0 left-0 bg-surface dark:bg-on-background flex items-center justify-between px-screen-edge h-16 sticky z-10 transition-colors duration-300">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed group-active:scale-95 transition-transform duration-200">close</span>
</button>
<h1 class="font-headline-tier-mobile text-headline-tier-mobile font-bold text-primary dark:text-primary-fixed">Session Complete</h1>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md mx-auto px-screen-edge flex flex-col mt-6 gap-section-margin relative z-0">
<!-- XP Ring & Level Progress -->
<section class="flex flex-col items-center pt-8 pb-4 relative">
<div class="relative w-48 h-48 flex items-center justify-center">
<svg class="circular-chart absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 36 36">
<path class="circle-bg" d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831"></path>
<path class="circle" d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831" stroke="url(#sunsetGradient)"></path>
</svg>
<div class="absolute flex flex-col items-center justify-center text-center">
<span class="font-section-label text-section-label text-text-muted uppercase tracking-wider mb-1">Seeker 5</span>
<span class="font-display-xp-mobile text-display-xp-mobile text-primary tracking-tight">3,440</span>
<span class="font-body-muted text-body-muted text-text-muted mt-1">/ 3,450 XP</span>
</div>
</div>
<div class="mt-6 text-center">
<h2 class="font-headline-tier-mobile text-headline-tier-mobile text-primary">Almost there!</h2>
<p class="font-body-main text-body-main text-text-muted mt-2 max-w-[280px]">Just 10 more XP to reach Seeker 6. Keep up the amazing dedication.</p>
</div>
</section>
<!-- Session Breakdown Cards (Bento Style) -->
<section class="grid grid-cols-2 gap-card-gap">
<!-- Primary XP Source -->
<div class="col-span-2 bg-surface-card rounded-3xl p-internal-lg shadow-ambient flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center">
<span class="material-symbols-outlined text-axis-knowledge" style="font-variation-settings: 'FILL' 1;">menu_book</span>
</div>
<div>
<h3 class="font-body-main text-body-main font-semibold text-primary">Tajweed Masterclass</h3>
<p class="font-body-muted text-body-muted text-text-muted">Completed Session</p>
</div>
</div>
<div class="text-right">
<span class="font-headline-tier-mobile text-headline-tier-mobile text-axis-knowledge block">+150</span>
<span class="font-section-label text-section-label text-text-muted">XP</span>
</div>
</div>
<!-- Streak Bonus -->
<div class="col-span-1 bg-surface-card rounded-3xl p-internal-lg shadow-ambient flex flex-col justify-between min-h-[140px] relative overflow-hidden">
<!-- Subtle background decoration -->
<div class="absolute -right-4 -bottom-4 opacity-10">
<span class="material-symbols-outlined text-[80px]" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<div>
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-gradient-sunset-mid" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-section-label text-section-label text-text-muted uppercase">6 Day Streak</span>
</div>
<p class="font-body-main text-body-main font-semibold text-primary leading-tight">Consistency<br>Bonus</p>
</div>
<div class="mt-4">
<span class="font-headline-tier-mobile text-headline-tier-mobile text-gradient-sunset-mid block">+50</span>
<span class="font-section-label text-section-label text-text-muted">XP</span>
</div>
</div>
<!-- Axis Contribution -->
<div class="col-span-1 bg-surface-card rounded-3xl p-internal-lg shadow-ambient flex flex-col justify-between min-h-[140px]">
<div>
<div class="flex items-center gap-2 mb-2">
<div class="w-2 h-2 rounded-full bg-axis-knowledge"></div>
<span class="font-section-label text-section-label text-text-muted uppercase">Knowledge</span>
</div>
<p class="font-body-main text-body-main font-semibold text-primary leading-tight">Axis<br>Growth</p>
</div>
<div class="mt-4 w-full bg-surface-container rounded-full h-1.5 overflow-hidden">
<div class="bg-axis-knowledge h-full rounded-full w-[65%]"></div>
</div>
</div>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-screen-edge bg-gradient-to-t from-bg-app via-bg-app to-transparent pb-8 pt-12 z-20">
<div class="max-w-md mx-auto w-full">
<button class="w-full h-[52px] bg-gradient-sunset rounded-full flex items-center justify-center shadow-md hover:shadow-lg active:scale-[0.98] transition-all duration-200">
<span class="font-body-main text-body-main font-semibold text-white">Continue</span>
</button>
</div>
</div>
</body></html>
